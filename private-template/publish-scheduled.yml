name: Publish due releases
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-release-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Publish verified due releases
        env:
          XOTIIC_PUBLISH_TOKEN: ${{ secrets.XOTIIC_PUBLISH_TOKEN }}
        run: |
          test -n "$XOTIIC_PUBLISH_TOKEN" || { echo 'Set XOTIIC_PUBLISH_TOKEN in this private repository.'; exit 1; }
          node scripts/private-storage.cjs publish-due --apply
