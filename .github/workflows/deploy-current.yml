name: Deploy current XotiicDuck site
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: xotiicduck-pages
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/configure-pages@v5
      - name: Build public assets from the validated commit
        run: npm run build:public
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
