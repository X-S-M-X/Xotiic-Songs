name: Deploy current XotiicDuck site

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: xotiicduck-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the current main branch
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble the public static site
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.release-train/' \
            --exclude='_site/' \
            --exclude='tests/' \
            --exclude='analytics-worker/' \
            --exclude='android-twa/' \
            --exclude='node_modules/' \
            --exclude='*.md' \
            --exclude='package.json' \
            --exclude='package-lock.json'
          test -f _site/index.html
          test -f _site/catalog.js
          test -f _site/admin/admin-hotfix.css

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
